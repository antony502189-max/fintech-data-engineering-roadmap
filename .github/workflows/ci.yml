name: Validate curriculum and lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: python scripts/check_english.py
      - run: python scripts/check_sql.py
      - run: python practice/run.py verify
      - run: python -m fintech_lab --out work/ci-demo
